<svg xmlns="http://www.w3.org/2000/svg" width="375" height="900" viewBox="0 0 375 900">
  <defs>
    <linearGradient id="wallBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f3ea"/>
      <stop offset="0.48" stop-color="#f4eee4"/>
      <stop offset="1" stop-color="#f7f1e8"/>
    </linearGradient>

    <filter id="wallTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="softNoise">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>

    <linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b79567"/>
      <stop offset="0.25" stop-color="#d1b487"/>
      <stop offset="0.55" stop-color="#a98355"/>
      <stop offset="0.8" stop-color="#d7bb90"/>
      <stop offset="1" stop-color="#9c774c"/>
    </linearGradient>

    <filter id="frameShadow" x="-30%" y="-50%" width="160%" height="200%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.5" flood-color="#6f5133" flood-opacity="0.20"/>
    </filter>

    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 7 C9 3 17 11 36 5
               M0 18 C10 14 22 23 36 17
               M0 30 C11 26 21 34 36 29"
            fill="none" stroke="#8f704d" stroke-opacity="0.10" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- One continuous warm gallery wall -->
  <rect width="375" height="900" fill="url(#wallBase)"/>
  <rect width="375" height="900" fill="#bca98e" opacity="0.10" filter="url(#wallTexture)"/>

  <!-- very restrained light falloff -->
  <ellipse cx="84" cy="35" rx="180" ry="125" fill="#ffffff" opacity="0.16"/>
  <ellipse cx="335" cy="420" rx="180" ry="330" fill="#d6c8b5" opacity="0.045"/>

  <!-- 03B: simple classical title frame -->
  <g filter="url(#frameShadow)">
    <!-- outer classical contour with clipped corners -->
    <path d="
      M37 11
      H338
      L345 18
      V52
      L338 59
      H37
      L30 52
      V18
      Z"
      fill="#f7f1e7"
      fill-opacity="0.52"
      stroke="url(#frameStroke)"
      stroke-width="1.45"/>

    <!-- subtle wood/grain wash inside border -->
    <path d="
      M37 11
      H338
      L345 18
      V52
      L338 59
      H37
      L30 52
      V18
      Z"
      fill="url(#grain)"
      opacity="0.55"/>

    <!-- inner fine rule -->
    <path d="
      M41 15
      H334
      L341 22
      V48
      L334 55
      H41
      L34 48
      V22
      Z"
      fill="none"
      stroke="#c7aa7d"
      stroke-opacity="0.80"
      stroke-width="0.65"/>

    <!-- tiny restrained corner accents -->
    <path d="M30 25 h7 M338 25 h7 M30 45 h7 M338 45 h7"
          stroke="#9f7a4f" stroke-opacity="0.42" stroke-width="0.6"/>
  </g>
</svg>
